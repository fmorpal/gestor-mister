<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Administración · Fuera de Juego</title>

<meta name="theme-color" content="#0a2e1c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07130d" media="(prefers-color-scheme: dark)">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">

</head>

<body>

<!-- =========================================================
     PANTALLA DE ACCESO
========================================================= -->

<div class="acceso" id="pantallaAcceso">

    <div class="acceso-caja">

        <span class="acceso-icono"><i class="bi bi-shield-lock-fill"></i></span>

        <h1>Panel de administración</h1>
        <p>Introduce la contraseña para editar posiciones y pagos.</p>

        <form id="formAcceso" autocomplete="off">

            <input type="password"
                   id="campoClave"
                   placeholder="Contraseña"
                   inputmode="text"
                   autocapitalize="off"
                   autocorrect="off"
                   required>

            <button type="submit" class="boton-principal">
                Entrar
            </button>

        </form>

        <p class="acceso-error" id="errorAcceso" hidden></p>

    </div>

</div>


<!-- =========================================================
     BARRA SUPERIOR
========================================================= -->

<header class="topbar" id="topbar" hidden>

    <div class="topbar-inner">

        <div class="brand">
            <span class="brand-escudo"><i class="bi bi-sliders"></i></span>
            <span class="brand-texto">
                <strong>Administración</strong>
                <small id="estadoGuardado">Sin cambios</small>
            </span>
        </div>

        <button type="button" id="botonSalir" class="boton-icono" aria-label="Salir">
            <i class="bi bi-box-arrow-right"></i>
        </button>

    </div>

</header>


<!-- =========================================================
     CONTENIDO
========================================================= -->

<main id="contenido" hidden>

    <p class="aviso-info">
        <i class="bi bi-info-circle"></i>
        Elige una jornada, ajusta posiciones y pagos, y pulsa
        <b>Guardar cambios</b>. El resto de la liga (resumen, saldos,
        multas) se recalcula solo.
    </p>

    <div class="jornada-pills" id="selectorJornada" role="tablist" aria-label="Elegir jornada"></div>

    <div id="listaEdicion"></div>

</main>


<!-- Barra flotante de guardado -->
<div class="barra-guardar" id="barraGuardar" hidden>
    <span id="resumenCambios">Cambios sin guardar</span>
    <button type="button" id="botonGuardar" class="boton-principal boton-pequeno">
        <i class="bi bi-cloud-upload"></i>
        Guardar cambios
    </button>
</div>


<!-- Aviso flotante -->
<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>


<script src="admin.js"></script>

</body>
</html>
