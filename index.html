<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<!--
    viewport-fit=cover  → permite usar toda la pantalla en iPhone
                          con notch / Dynamic Island.
    maximum-scale libre → no bloqueamos el zoom (accesibilidad).
-->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Fuera de Juego · Liga Mister</title>
<meta name="description" content="Pagos, jornadas y saldos de la liga Fuera de Juego.">

<!-- Color de la barra del navegador (Chrome Android y Safari 15+) -->
<meta name="theme-color" content="#0a2e1c" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07130d" media="(prefers-color-scheme: dark)">

<!-- Instalable como app en iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuera de Juego">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<!-- Iconos -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================================================
     BARRA SUPERIOR
========================================================= -->

<header class="topbar" id="topbar">

    <div class="topbar-inner">

        <div class="brand">
            <span class="brand-escudo"><i class="bi bi-trophy-fill"></i></span>
            <span class="brand-texto">
                <strong>Fuera de Juego</strong>
                <small id="tituloVista">Resumen</small>
            </span>
        </div>

        <button type="button"
                id="botonRecargar"
                class="boton-icono"
                aria-label="Actualizar datos">
            <i class="bi bi-arrow-clockwise"></i>
        </button>

    </div>

    <!-- Indicador de "tirar para actualizar" -->
    <div class="ptr" id="ptr" aria-hidden="true">
        <i class="bi bi-arrow-down"></i>
    </div>

</header>


<!-- =========================================================
     CONTENIDO
========================================================= -->

<main id="contenido">

<!-- ------------------- RESUMEN ------------------- -->
<section class="vista vista-activa" id="vista-resumen" aria-label="Resumen">

    <div class="marcador">

        <div class="marcador-cabecera">
            <span>Pendiente de cobrar</span>
            <span class="conexion conexion-cargando" id="estadoConexion">
                <span class="conexion-punto"></span>
                <span id="estadoConexionTexto">Cargando</span>
            </span>
        </div>

        <p class="marcador-cifra" id="dineroPendiente">—</p>

        <div class="barra-bote" aria-hidden="true">
            <span id="barraBote"></span>
        </div>

        <div class="marcador-pie">
            <span><i class="bi bi-check2-circle"></i> <b id="dineroActual">—</b> cobrado</span>
            <span><i class="bi bi-wallet2"></i> <b id="dineroTotal">—</b> total</span>
        </div>

    </div>

    <div class="rejilla-datos">

        <article class="dato">
            <span class="dato-etiqueta">Jornadas jugadas</span>
            <strong class="dato-valor" id="jornadasCompletadas">—</strong>
            <span class="dato-pie">de 38</span>
        </article>

        <article class="dato">
            <span class="dato-etiqueta">Jugadores al día</span>
            <strong class="dato-valor" id="jugadoresAlDia">—</strong>
            <span class="dato-pie" id="jugadoresTotales">&nbsp;</span>
        </article>

        <article class="dato">
            <span class="dato-etiqueta">Multas acumuladas</span>
            <strong class="dato-valor" id="multasTotales">—</strong>
            <span class="dato-pie">en toda la liga</span>
        </article>

        <article class="dato">
            <span class="dato-etiqueta">Mayor deuda</span>
            <strong class="dato-valor" id="mayorDeuda">—</strong>
            <span class="dato-pie" id="mayorDeudaNombre">&nbsp;</span>
        </article>

    </div>

    <h2 class="titulo-bloque">Quién debe más</h2>

    <div class="lista" id="listaMorosos">
        <div class="esqueleto"></div>
        <div class="esqueleto"></div>
        <div class="esqueleto"></div>
    </div>

    <p class="nota-pie">
        <i class="bi bi-cloud-check"></i>
        <span id="ultimaActualizacion">Conectando con la hoja de cálculo…</span>
    </p>

</section>


<!-- ------------------- JUGADORES ------------------- -->
<section class="vista" id="vista-jugadores" aria-label="Jugadores" hidden>

    <div class="buscador">
        <i class="bi bi-search"></i>
        <input type="search"
               id="buscadorJugadores"
               placeholder="Buscar jugador"
               autocomplete="off"
               autocapitalize="words"
               enterkeyhint="search"
               aria-label="Buscar jugador">
        <button type="button" class="buscador-limpiar" id="limpiarBusqueda" hidden aria-label="Borrar búsqueda">
            <i class="bi bi-x-circle-fill"></i>
        </button>
    </div>

    <div class="chips" id="chipsOrden" role="tablist" aria-label="Ordenar jugadores">
        <button type="button" class="chip chip-activo" data-orden="pendiente">Deuda</button>
        <button type="button" class="chip" data-orden="totalPagado">Pagado</button>
        <button type="button" class="chip" data-orden="multas">Multas</button>
        <button type="button" class="chip" data-orden="saldo">Saldo</button>
        <button type="button" class="chip" data-orden="nombre">A–Z</button>
    </div>

    <div class="lista" id="listaJugadores">
        <div class="esqueleto"></div>
        <div class="esqueleto"></div>
        <div class="esqueleto"></div>
        <div class="esqueleto"></div>
    </div>

</section>


<!-- ------------------- JORNADAS ------------------- -->
<section class="vista" id="vista-jornadas" aria-label="Jornadas" hidden>

    <div class="jornada-pills" id="selectorJornada" role="tablist" aria-label="Elegir jornada"></div>

    <div id="jornadaInfo"></div>

    <div class="lista" id="listaJornada"></div>

</section>

</main>


<!-- =========================================================
     NAVEGACIÓN INFERIOR
========================================================= -->

<nav class="tabbar" id="tabbar" aria-label="Secciones">

    <button type="button" class="tab tab-activo" data-vista="resumen" aria-current="page">
        <i class="bi bi-speedometer2"></i>
        <span>Resumen</span>
    </button>

    <button type="button" class="tab" data-vista="jugadores">
        <i class="bi bi-people-fill"></i>
        <span>Jugadores</span>
    </button>

    <button type="button" class="tab" data-vista="jornadas">
        <i class="bi bi-calendar3"></i>
        <span>Jornadas</span>
    </button>

</nav>


<!-- =========================================================
     FICHA DE JUGADOR (panel deslizante)
========================================================= -->

<div class="sheet-fondo" id="sheetFondo" hidden></div>

<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetNombre" hidden>
    <button type="button" class="sheet-tirador" id="sheetCerrar" aria-label="Cerrar ficha"></button>
    <div class="sheet-cuerpo" id="sheetCuerpo"></div>
</aside>


<!-- Aviso flotante (sin conexión, datos guardados…) -->
<div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>


<script src="script.js"></script>

</body>
</html>
